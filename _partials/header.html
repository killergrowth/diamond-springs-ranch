<div class="kg-emergency-bar">{{CLIENT_EMERGENCY_BAR}}</div>

      <span class="kg-logo-wrap">
        <img src="/images/logo-black.png" alt="{{CLIENT_NAME}}" class="kg-logo-dark">
        <img src="/images/logo-white.png" alt="{{CLIENT_NAME}}" class="kg-logo-light">
      </span>
      <span class="kg-logo-text">Diamond Springs Ranch</span>
    </a>
    <nav class="kg-nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <div class="kg-nav-dropdown">
        <a href="/services/">Experiences</a>
        <div class="kg-dropdown-menu">
          {{SERVICE_NAV_LINKS}}
        </div>
      </div>
      <div class="kg-nav-dropdown">
        <a href="/service-areas/">Nearby Cities</a>
        <div class="kg-dropdown-menu">
          {{CITY_NAV_LINKS}}
          <a href="/service-areas/">View All &rarr;</a>
        </div>
      </div>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>
    <div class="kg-header-cta">
      <a href="tel:{{CLIENT_PHONE_RAW}}" class="kg-header-phone">&#9742; {{CLIENT_PHONE}}</a>
      <a href="/contact/" class="btn btn-primary" style="padding:11px 22px;font-size:0.82rem;">Book a Visit &rarr;</a>

<nav class="kg-mobile-nav" id="kg-mobile-nav" aria-label="Mobile navigation">
  <a href="/">Home</a>
  <button class="mobile-section-toggle" aria-expanded="false">Experiences <span class="mobile-toggle-icon">+</span></button>
  <div class="mobile-group">
    <a href="/services/">All Experiences</a>
    {{SERVICE_MOBILE_LINKS}}
  </div>
  <button class="mobile-section-toggle" aria-expanded="false">Nearby Cities <span class="mobile-toggle-icon">+</span></button>
  <div class="mobile-group">
    <a href="/service-areas/">All Cities</a>
    {{CITY_MOBILE_LINKS}}
  </div>
  <a href="/about/">About Us</a>
  <a href="/contact/">Contact</a>
  <a href="tel:{{CLIENT_PHONE_RAW}}" style="color:var(--kg-primary);font-size:1.1rem;font-weight:700;margin-top:12px;">{{CLIENT_PHONE}}</a>
</nav>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap');

  /* Logo lockup */
  .kg-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
  }

  /* Logo image wrapper — stacks black and white on top of each other */
  .kg-logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    height: 36px;
    flex-shrink: 0;
  }

  .kg-logo-dark,
  .kg-logo-light {
    height: 36px;
    width: auto;
    display: block;
    transition: opacity 0.35s ease;
  }

  /* White logo sits on top, hidden by default */
  .kg-logo-light {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
  }

  /* Brand name — Norwester via local fallback, Roboto Condensed as web fallback */
  .kg-logo-text {
    font-family: 'Norwester', 'Roboto Condensed', 'Arial Narrow', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: #2F2A26;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 0.35s ease;
    line-height: 1;
  }

  /* Scrolled state: white logo fades in, black fades out, text goes white */
  .kg-header.scrolled .kg-logo-dark  { opacity: 0; }
  .kg-header.scrolled .kg-logo-light { opacity: 1; }
  .kg-header.scrolled .kg-logo-text  { color: #fff; }
</style>
